services:
  # Backend Web Service (FastAPI)
  - type: web
    name: batteryguard-backend
    runtime: python
    rootDir: batteryguard-ai/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///./batteryguard.db
      - key: CORS_ORIGINS
        value: '["*"]'

  # Frontend Static Site (React Vite)
  - type: web
    name: batteryguard-frontend
    runtime: static
    rootDir: batteryguard-ai/frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    plan: free
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE
        value: https://batteryguard-backend.onrender.com/api
